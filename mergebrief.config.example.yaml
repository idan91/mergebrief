# MergeBrief instance config. Copy to `mergebrief.config.yaml` (gitignored),
# set MERGEBRIEF_CONFIG=mergebrief.config.yaml in `.env`, and mount the file
# into `api` and `worker` (docs/self-host/compose.md). Edits apply on restart.
#
# You need this file: nobody can sign in until `operators` or `allowed` names
# them. Every other block is optional. A commented line shows the default, or
# an example where the key has none. A line commented twice is an example for
# one provider or one mode: uncommenting its block leaves it off.
#
# An unknown key refuses boot. A credential never goes here: the file names
# the environment variable that holds it.
#
# Every key and what it accepts: docs/self-host/configuration.md

# --- Operators (required) ----------------------------------------------------
# The GitHub users who run this instance, by numeric id, never by login.
# Find yours with `gh api users/<login> --jq .id`. Boot refuses until you
# replace the placeholder. docs/self-host/generators.md#operators
operators:
  - <your-github-user-id>

# --- Who else may sign in and start a brief ----------------------------------
# `accounts` lets in the people of an org or personal account the App is
# installed on. `users` adds single people. Ids, never logins: find an org's
# with `gh api orgs/<org> --jq .id`.
# docs/self-host/generators.md#who-may-start-a-brief
# allowed:
#   users:
#     - <github-user-id>
#   accounts:
#     - <org-or-account-id>

# --- Generator (provider and model) ------------------------------------------
# No block runs `anthropic` on ANTHROPIC_API_KEY with claude-opus-5-5.
# Where each provider's model names come from, with an example for each:
# docs/self-host/generators.md#model-names-by-provider
# generator:
#   # anthropic | openai | openrouter | claude-code | codex | cursor
#   provider: anthropic
#
#   # Default claude-opus-5-5. This line is the cheaper option, not the default.
#   # Required for openai and openrouter.
#   model: claude-sonnet-5-5
#
#   # low | medium | high. cursor ignores it and reads the model id's suffix.
#   effort: medium
#
#   # never | on-model-swap | always: when a new revision's brief restarts from
#   # scratch, not from the previous brief.
#   fullRegeneration: never
#
#   # true runs every brief as a multi-call run. A diagnostic, and it costs more.
#   forceMultiCall: false
#
#   # Detail calls a multi-call run keeps in flight. Lower it for a rate limit.
#   detailConcurrency: 8
#
#   # false skips the revision narrative against the previous brief.
#   revisionNarrative: true
#
#   # The share of a PR's changed lines, above 0 and at most 1, at which an
#   # incremental span falls back to the full brief.
#   hugeSpanRatio: 0.65
#
#   # API providers: the NAME of the variable holding the key. Defaults:
#   # ANTHROPIC_API_KEY, OPENAI_API_KEY, OPENROUTER_API_KEY.
#   # apiKeyEnv: MY_PROVIDER_KEY_VAR
#
#   # anthropic, openai: a gateway. anthropic takes the host root with no /v1,
#   # openai takes the /v1 root.
#   # baseUrl: https://gateway.example
#
#   # openrouter only: routing options and attribution headers.
#   # providerRouting:
#   #   order: ["anthropic"]
#   # referer: https://you.example
#   # title: MergeBrief
#
#   # claude-code, codex, cursor only: host processes, refused in the image.
#   # The binary, and the run's timers in milliseconds.
#   # command: claude
#   # timeouts:
#   #   hardMs: 900000
#   #   inactivityMs: 180000
#   #   killGraceMs: 5000

# --- Daily generation cap ----------------------------------------------------
# The most runs per UTC day across every repo. `unlimited` lifts the cap.
# docs/self-host/generators.md#daily-generation-cap
# spend:
#   maxGenerationsPerDay: 300

# --- Draft pull requests -----------------------------------------------------
# `generate: off` holds a draft's first brief until it is marked ready.
# `debounceSeconds` sets a longer wait before a draft regenerates. It has no
# default: unset, a draft waits the normal 60 seconds.
# docs/self-host/repo-config.md#related-instance-block-drafts-operator-side
# drafts:
#   generate: on
#   debounceSeconds: 900

# --- Trackers (the boards every repo reads tickets from) ---------------------
# No block reads GitHub issues only. A repo's own `.mergebrief/settings.yaml`
# replaces this list for that repo. A notion or jira entry needs its
# `contextSources` entry below. docs/self-host/trackers.md
# trackers:
#   - kind: notion
#     keyPrefix: ACME
#     databaseId: 1a2b3c4d5e6f40718293a4b5c6d7e8f9
#   - kind: jira
#     projectKeys: [WEB, OPS]
#   - kind: github
#     issuesRepo: owner/name
#     siblingRepos: false

# --- Context sources (tracker credentials) -----------------------------------
# One entry per tracker type that needs a credential. Each key names the
# variable holding it, and an entry whose variable is unset refuses boot.
# docs/self-host/trackers.md
# contextSources:
#   - type: notion
#     tokenEnv: NOTION_TOKEN
#   - type: jira
#     site: acme.atlassian.net
#     emailEnv: JIRA_EMAIL
#     tokenEnv: JIRA_API_TOKEN
#     linkHosts:
#       - jira.acme.example

# --- Retention and audit ----------------------------------------------------
# Days the daily sweeps keep audit rows (at least 30) and closed pull requests
# (at least 1). Neither has a default: unset, rows are kept forever.
# docs/self-host/operations.md
# retention:
#   auditDays: 365
#   pullRequestDays: 90
#
# false stops recording writes that stay inside the instance. Writes that
# reach GitHub and every denial are recorded either way.
# audit:
#   privateWrites: true

# --- Update check -----------------------------------------------------------
# false stops the hourly fetch of version.json and the version notice. `url`
# names a mirror, for a network that blocks github.com.
# docs/self-host/operations.md#the-update-check
# updateCheck:
#   enabled: true
#   # url: https://mirror.example.com/version.json

# --- Attachments and media --------------------------------------------------
# What one reviewer may attach per window, and the largest video or image,
# in megabytes, the api streams. docs/self-host/attachments.md
# attachments:
#   quotaFiles: 10
#   quotaMb: 30
#   quotaWindowMinutes: 10
#   mediaMaxMb: 100

# --- Link fetch (the links a PR description cites) ---------------------------
# public (the default) | off | allowlist. `hosts` goes with allowlist only.
# docs/self-host/configuration.md#linkfetch
# linkFetch:
#   mode: allowlist
#   hosts:
#     - docs.example.com
#   maxTotalChars: 40000
