services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: code_review
      POSTGRES_PASSWORD: code_review
      POSTGRES_DB: code_review
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U code_review -d code_review"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
