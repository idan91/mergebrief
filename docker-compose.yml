# One-command self-host (BRIEF-3, ADR 0015): `docker compose up` brings up
# Postgres (the single stateful dependency), the web/API tier, and the
# long-lived generation worker. Credentials come from a repo-root `.env`
# (copy `.env.example`; compose reads it automatically for ${...}
# interpolation AND both services load it via env_file, so a var you leave
# out of .env is genuinely ABSENT in the container — the config loaders
# treat empty-string and unset differently, e.g. the private-key one-of).
#
# All published ports bind loopback-only: dev/self-host credentials must not
# be reachable from the LAN. Put a reverse proxy in front for real exposure.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: code_review
      POSTGRES_PASSWORD: code_review
      POSTGRES_DB: code_review
    ports:
      # Loopback-only: dev credentials must not be reachable from the LAN.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U code_review -d code_review"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # In-network DSN overrides any host-oriented value from .env.
      DATABASE_URL: postgres://code_review:code_review@postgres:5432/code_review
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
    volumes:
      # URL-box/demo brief artifacts (BRIEF-97): host-persisted so a rebuild
      # or recreate never wipes generated briefs, and host-side CLI runs
      # (`pnpm categorize`) show up in the composed web app too.
      - ./tools/categorizer/out:/app/tools/categorizer/out
      # Instance config (mergebrief.config.yaml + MERGEBRIEF_CONFIG in .env):
      # the image already bakes the repo-root file via `COPY . .`; this mount
      # shadows it so edits apply on restart instead of rebuild. Uncomment
      # here AND in the worker service — both read the same file.
      # - ./mergebrief.config.yaml:/app/mergebrief.config.yaml:ro
    # Liveness only (ADR 0034 #7): /healthz is static — never /readyz here,
    # or a DB blip would trigger web restart churn.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO /dev/null http://127.0.0.1:3000/healthz || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: &log-rotation
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://code_review:code_review@postgres:5432/code_review
      # The Entry comment's deep-link base — same value the web tier uses.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
    # See the web service's mergebrief.config.yaml mount note — uncomment
    # both together.
    # volumes:
    #   - ./mergebrief.config.yaml:/app/mergebrief.config.yaml:ro
    # No HTTP surface to probe; liveness = the runner process itself.
    # Restart on crash so a transient boot race (e.g. Postgres restarting)
    # self-heals without an operator.
    restart: unless-stopped
    logging: *log-rotation

volumes:
  postgres_data:
