# External-Postgres compose: api + web + worker, with YOUR database
# (managed provider or any Postgres 16+) replaces the bundled `postgres`
# service. A separate checked-in file, not a profile or override, on purpose:
# `depends_on` cannot reference a profiled-out service without erroring, and
# an override file cannot REMOVE a service. Usage:
#
#   docker compose -f docker-compose.external-db.yml up -d
#
# or set `COMPOSE_FILE=docker-compose.external-db.yml` in `.env` so every
# plain `docker compose` command reads this file.
#
# DATABASE_URL comes from `.env` (env_file below) or the shell you run
# compose from (the pass-through entries under `environment:`; a shell value
# wins over `.env`). A NON-loopback host must carry an explicit `sslmode`
# DSN parameter or boot is refused — see docs/self-host/compose.md for the
# provider recipes (verify-full + CA bundle, the `require` trap, `_FILE`
# secrets). There is no `depends_on` on the database: the services fail
# loudly against an unreachable one instead of gating on a healthcheck
# compose cannot see.
#
# All published ports bind loopback-only, same as the default compose.
services:
  api:
    image: ghcr.io/idan91/mergebrief:dev
    build:
      context: .
      dockerfile: Dockerfile
    command: api
    # Same policy as the default compose: a config error exits 0 and stays
    # down, a transient fault (pending migrations included) exits 1 and
    # self-heals on the restart.
    restart: on-failure
    # No published port: reached through the web tier on the compose network.
    expose:
      - "3001"
    # API containers. Every replica is interchangeable (state lives in
    # Postgres; boot migrations take an advisory lock); web reaches them by
    # service name, which gives failover when one exits, not an even split,
    # and a write can read stale for a minute from another replica
    # (docs/self-host/operations.md, "Running more than one api").
    # `docker compose up --scale api=N` wins over this for that run. No
    # container_name and no ports, so scaling needs nothing else.
    deploy:
      replicas: ${API_COUNT:-1}
    env_file:
      - path: .env
        required: false
    environment:
      # Pass-through (no `=`): each rides in from the shell running compose
      # when set there, otherwise the `.env` value applies; an entry unset in
      # both stays genuinely ABSENT in the container (the loaders distinguish
      # unset from empty — do not give these empty defaults).
      - DATABASE_URL
      - DATABASE_URL_FILE
      - MERGEBRIEF_AUTO_MIGRATE
      # Defaulted (not pass-through): parity with the default compose, so an
      # .env that omits it keeps working after switching files.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:3000}
      # Reachable from the web service, not from the host.
      - MERGEBRIEF_API_HOST=0.0.0.0
      - MERGEBRIEF_API_PORT=3001
    # Uncomment to hand the DSN over as a file instead of an env var (and
    # set DATABASE_URL_FILE=/run/secrets/database-url in .env). The CA mount
    # pairs with sslmode=verify-full&sslrootcert=/etc/ssl/certs/provider-ca.pem.
    # Instance config (mergebrief.config.yaml): uncomment here AND in the
    # worker service; both read the same file.
    # secrets:
    #   - database-url
    # volumes:
    #   - ./secrets/provider-ca.pem:/etc/ssl/certs/provider-ca.pem:ro
    #   - ./mergebrief.config.yaml:/app/mergebrief.config.yaml:ro
    # Liveness only: /healthz is static, never /readyz here, or a DB blip
    # would trigger restart churn on the tier that owns the database.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO /dev/null http://127.0.0.1:3001/healthz || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: &log-rotation
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ghcr.io/idan91/mergebrief:dev
    build:
      context: .
      dockerfile: Dockerfile
    command: web
    restart: on-failure
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        # `service_healthy`, not `service_started`: the API does not listen
        # until the schema and queue migrations finish.
        condition: service_healthy
    # No `env_file` on purpose: the internet-facing tier holds no
    # credentials, so `.env` never reaches its process environment.
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      MERGEBRIEF_API_ORIGIN: http://api:3001
    # volumes:
    #   - ./mergebrief.config.yaml:/app/mergebrief.config.yaml:ro
    # Liveness only: /healthz is static, never /readyz here,
    # or an upstream blip would trigger web restart churn.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO /dev/null http://127.0.0.1:3000/healthz || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *log-rotation

  worker:
    image: ghcr.io/idan91/mergebrief:dev
    build:
      context: .
      dockerfile: Dockerfile
    command: worker
    env_file:
      - path: .env
        required: false
    environment:
      # Same pass-through contract as the api service.
      - DATABASE_URL
      - DATABASE_URL_FILE
      - MERGEBRIEF_AUTO_MIGRATE
      # Defaulted (not pass-through): parity with the default compose, so an
      # .env that omits it keeps working after switching files.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:3000}
      # Slots per worker; same contract as the default compose.
      # - WORKER_CONCURRENCY
    # Worker containers, same contract as the default compose:
    # `--scale worker=N` wins for that run.
    deploy:
      replicas: ${WORKER_COUNT:-1}
    # secrets:
    #   - database-url
    # volumes:
    #   - ./secrets/provider-ca.pem:/etc/ssl/certs/provider-ca.pem:ro
    #   - ./mergebrief.config.yaml:/app/mergebrief.config.yaml:ro
    # No HTTP surface to probe; liveness = the runner process itself.
    # on-failure: transient crashes (nonzero exit, e.g. a network blip or
    # provider failover) self-heal; config errors exit 0 and STAY DOWN
    # The reason is the last line of `docker compose logs worker`.
    restart: on-failure
    logging: *log-rotation
# The compose `secrets:` block the commented service entries reference —
# lands as /run/secrets/database-url in the container. `secrets/` is
# gitignored; keep the DSN file there (never somewhere `git add .` reaches).
# secrets:
#   database-url:
#     file: ./secrets/database-url
