name: Feature request
description: Propose a change to what MergeBrief does.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check "What MergeBrief will not do" in CONTRIBUTING.md first: severity scores, AI-authored review comments and general-purpose bug hunting are non-goals. A new Category or Risk-Surface attribute is a docs change; CONTRIBUTING.md has the bar.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do while reviewing, and where MergeBrief got in the way or fell short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: The change you have in mind. A sketch or an example pull request helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
