name: Deploy sites

# Deploys the docs site and the demo to Cloudflare Workers, each built from a
# release tag. A stable tag push deploys both; a candidate deploys only by a
# manual run. Runs only in idan91/mergebrief, so a fork's tag push does nothing.
# Each site builds in a job that holds no secret and uploads only the built
# folder. Its deploy job takes the wrangler config and .nvmrc from the tag,
# runs no repository code, and is the only job that sees the token.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy, vX.Y.Z or vX.Y.Z-rc.N
        required: true
        type: string

permissions: {}

# One run at a time, never cancelled halfway, so the run queued last deploys
# last on both sites. A candidate tag's push deploys nothing, so it takes a
# group of its own and never replaces a pending deploy.
concurrency:
  group: ${{ github.event_name == 'push' && contains(github.ref_name, '-rc.') && format('deploy-sites-noop-{0}', github.run_id) || 'deploy-sites' }}
  cancel-in-progress: false

jobs:
  plan:
    name: Resolve the tag
    if: github.repository == 'idan91/mergebrief'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      deploy: ${{ steps.resolve.outputs.deploy }}

    steps:
      # The grammar is the release tool's: vX.Y.Z or vX.Y.Z-rc.N, no leading zeros.
      - name: Resolve and check the tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSHED_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$PUSHED_TAG"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          fi
          pattern='^v(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})(-rc\.(0|[1-9][0-9]{0,8}))?$'
          if ! [[ "$tag" =~ $pattern ]]; then
            echo "::error::not a release tag"
            printf 'tag: %s\n' "$tag"
            exit 1
          fi
          deploy=true
          if [ "$EVENT_NAME" = "push" ] && [[ "$tag" == *-rc.* ]]; then
            deploy=false
          fi
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "deploy=$deploy"
          } >> "$GITHUB_OUTPUT"

      # Release's verify refuses a tag without its notes file, so the sites
      # refuse it too: a tag on the wrong commit never goes live.
      - name: Check out the tag's notes file
        if: steps.resolve.outputs.deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.resolve.outputs.tag }}
          persist-credentials: false
          sparse-checkout: |
            docs/releases/${{ steps.resolve.outputs.version }}.md
          sparse-checkout-cone-mode: false

      - name: Refuse a tag without its notes file
        if: steps.resolve.outputs.deploy == 'true'
        env:
          NOTES_FILE: docs/releases/${{ steps.resolve.outputs.version }}.md
        run: |
          if [ ! -f "$NOTES_FILE" ]; then
            echo "::error::the tag has no notes file"
            printf 'missing: %s\n' "$NOTES_FILE"
            exit 1
          fi

  docs-build:
    name: Build the docs site
    needs: plan
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      # A tag that does not exist fails here: content only ever comes from a
      # release tag.
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # A deploying workflow restores no cache: a poisoned entry would
          # ship on the site.
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the docs site
        env:
          MERGEBRIEF_DOCS_VERSION: ${{ needs.plan.outputs.version }}
          MERGEBRIEF_DOCS_SITE_URL: https://docs.mergebrief.com
        run: pnpm -C apps/docs-site build

      - name: Upload the built site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: apps/docs-site/.vitepress/dist
          # The artifact drops dot-paths unless told otherwise; .vitepress is one.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  docs-deploy:
    name: Deploy the docs site
    needs: [plan, docs-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      # The config wrangler reads, and so any command it could run, comes from
      # the tag, never from the build job.
      - name: Check out the config from the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag }}
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            apps/docs-site/wrangler.jsonc
          sparse-checkout-cone-mode: false

      - name: Download the built site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-site
          path: apps/docs-site/.vitepress/dist

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Deploy the docs site
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.160.0"
          workingDirectory: apps/docs-site
          command: deploy

  demo-build:
    name: Build the demo
    needs: plan
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      # A tag that does not exist fails here: content only ever comes from a
      # release tag.
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # A deploying workflow restores no cache: a poisoned entry would
          # ship on the site.
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the demo
        run: pnpm -C apps/web build:demo

      - name: Upload the built site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-site
          path: apps/web/dist-demo
          if-no-files-found: error
          retention-days: 1

  demo-deploy:
    name: Deploy the demo
    needs: [plan, demo-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      # The config wrangler reads, and so any command it could run, comes from
      # the tag, never from the build job.
      - name: Check out the config from the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag }}
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            apps/web/wrangler.demo.jsonc
          sparse-checkout-cone-mode: false

      - name: Download the built site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: demo-site
          path: apps/web/dist-demo

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Deploy the demo
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.160.0"
          workingDirectory: apps/web
          command: deploy --config wrangler.demo.jsonc
