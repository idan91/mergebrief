name: Web App CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  webapp-checks:
    name: Web app checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect web app changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          changed_files="$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA")"
          web_files="$(printf '%s\n' "$changed_files" | grep -E '^(apps/web/|package.json$|pnpm-lock.yaml$|pnpm-workspace.yaml$|\.npmrc$)' || true)"
          lint_files="$(printf '%s\n' "$changed_files" | grep -E '^apps/web/.*\.(css|jsx?|json|md|scss|tsx?)$' | sed 's#^apps/web/##' || true)"

          if [ -n "$web_files" ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$lint_files" ]; then
            echo "lint=true" >> "$GITHUB_OUTPUT"
            {
              echo "lint_files<<EOF"
              echo "$lint_files"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "lint=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm
        if: steps.changes.outputs.web == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Set up Node.js
        if: steps.changes.outputs.web == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install web app dependencies
        if: steps.changes.outputs.web == 'true'
        run: pnpm --filter @code-review/web... install --frozen-lockfile

      - name: Run web app tests
        if: steps.changes.outputs.web == 'true'
        run: pnpm --dir apps/web test

      - name: Lint changed web app files
        if: steps.changes.outputs.lint == 'true'
        env:
          LINT_FILES: ${{ steps.changes.outputs.lint_files }}
        shell: bash
        run: |
          mapfile -t lint_files <<< "$LINT_FILES"
          # pnpm script runner passes extra args through sh -c, re-expanding $
          # in filenames (e.g. briefs.$briefId.tsx → briefs..tsx). Use pnpm exec
          # instead so bash passes array elements directly to prettier via execve.
          (cd apps/web && pnpm exec prettier --check "${lint_files[@]}")

      - name: Typecheck web app
        if: steps.changes.outputs.web == 'true'
        run: pnpm --dir apps/web typecheck

      - name: Build web app
        if: steps.changes.outputs.web == 'true'
        run: pnpm --dir apps/web build

      - name: Skip web app checks
        if: steps.changes.outputs.web != 'true'
        run: echo "No web app files changed; skipping web app checks."
