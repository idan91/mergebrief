          if [ -n "$generators_files" ]; then
            echo "generators=true" >> "$GITHUB_OUTPUT"
          else
            echo "generators=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm
        if: steps.changes.outputs.generators == 'true'
        uses: pnpm/action-setup@v4
