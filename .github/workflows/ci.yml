          repo_config_files="$(printf '%s\n' "$changed_files" | grep -E '^(packages/repo-config/|tools/categorizer/|packages/generators/|packages/types/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.npmrc$)' || true)"

          if [ -n "$repo_config_files" ]; then
