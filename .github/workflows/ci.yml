name: CI

on:
  pull_request:

# Fork-safety bundle. No ambient scopes: every job re-grants
# the minimum it needs, no checkout leaves credentials in .git/config for a
# later step to reuse, and every action is pinned to a commit SHA.
# `pull_request_target` is banned in this repo — it would run fork code with
# a write-scoped token.
permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # The workspace root is a pnpm project too, and pnpm's `...[<ref>]` filter
  # attributes every file outside a package directory to it. Its scripts are
  # thin aliases for package scripts (`test` = categorizer, `typecheck` =
  # apps/web), so leaving it selected would re-run those suites under a
  # second name on any docs- or config-only change.
  WORKSPACE_ROOT_PROJECT: code-review

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Full workspace install: --type-aware needs each package's tsconfig
      # and dependency types, not just the oxlint binary.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Unfiltered on purpose: `pnpm lint` is a whole-repo gate (oxlint with
      # the house plugin, knip, `prettier --check .`, stylelint, and the
      # product operation catalog gate: manifest drift + CLI-map
      # exhaustiveness).
      # Prettier and knip read files no package owns — docs, root config —
      # so there is no change set that provably cannot break it.
      - name: Run lint
        run: pnpm lint

  catalog:
    name: Catalog gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Its own job, not a link in `pnpm lint`: this is a correctness gate
      # (manifest drift, CLI-map exhaustiveness, and the only evaluation of a
      # gap's expiry against the real date), and a style finding in an
      # untouched file must not be what stops it from running. Unfiltered and
      # deterministic — no network, a couple of seconds.
      - name: Run the product operation catalog gate
        run: pnpm check:catalog

  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # `slug` mirrors `check` with a filename-safe spelling: artifact
        # names reject `:`.
        include:
          - check: typecheck
            slug: typecheck
          - check: test
            slug: test
          - check: build
            slug: build
          - check: docs:check
            slug: docs-check

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pnpm's `...[<ref>]` filter resolves the ref in the local repo, so
          # the base branch's history has to be there.
          fetch-depth: 0
          persist-credentials: false

      - name: Select affected packages
        id: affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # A `pull_request` run checks out the merge ref, whose second
          # parent is the base tip, so BASE_SHA is an ancestor of HEAD and
          # merge-base returns it directly — an ancestor pnpm's TWO-dot
          # since-filter can safely diff against (a non-ancestor would report
          # the base branch's own commits as changes and over-select). If
          # base.sha is stale after the base advances, the result is the old
          # base tip: over-selection, never under-selection.
          base="$(git merge-base "$BASE_SHA" HEAD)"
          echo "base=$base" >> "$GITHUB_OUTPUT"

          # Files no package owns but every package depends on. pnpm maps
          # these to the workspace root only, which the filter excludes — so
          # without this escape hatch a lockfile bump would run nothing.
          # Buffered into a variable first: `git diff | grep -q` under
          # pipefail dies of SIGPIPE on >64KB diffs the moment grep exits,
          # silently flipping run_all to false — the escape hatch disarmed
          # exactly when a huge change needs it most.
          changed="$(git diff --name-only "$base" HEAD)"
          if grep -qE '^(\.github/workflows/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$|\.npmrc$|vitest\.shared\.ts$|tsconfig[^/]*\.json$)' <<<"$changed"; then
            echo "run_all=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_all=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.check }} on affected packages
        env:
          CHECK: ${{ matrix.check }}
          SLUG: ${{ matrix.slug }}
          BASE: ${{ steps.affected.outputs.base }}
          RUN_ALL: ${{ steps.affected.outputs.run_all }}
        run: |
          set -euo pipefail

          # `...[<ref>]` = packages changed since <ref> PLUS every package
          # that depends on them, read off the real workspace graph. That is
          # the path-filter hole: a github-package change now runs api's
          # suite too.
          filters=(--filter "!$WORKSPACE_ROOT_PROJECT")
          if [ "$RUN_ALL" = "true" ]; then
            echo "Root-level change detected; running the full workspace."
          else
            filters+=(--filter "...[$BASE]")
          fi

          # `--if-present` because the matrix is one script name across the
          # whole selection: only apps/web and the CLI have `build`, only the
          # CLI has `docs:check`. An empty selection exits 0 — that is the
          # skip.
          #
          # `pipefail` is already set, so `tee` cannot mask a failing suite.
          mkdir -p ci-logs
          pnpm -r "${filters[@]}" run --if-present "$CHECK" 2>&1 | tee "ci-logs/$SLUG.log"

      # Failure only: a green run's logs are already in the job output, and
      # a 7-day window is long enough to triage a red PR without paying
      # storage for every merge.
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-${{ matrix.slug }}-diagnostics
          # Anchored to the workspace globs in pnpm-workspace.yaml. An
          # unanchored `**/coverage/**` would make the uploader stat the
          # whole pnpm node_modules tree on every red run.
          path: |
            ci-logs/
            apps/*/coverage/**
            packages/*/coverage/**
            tools/*/coverage/**
            !**/node_modules/**
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: E2E (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same reason as `checks`: pnpm's `...[<ref>]` filter resolves the
          # ref in the local repo.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The suite exercises apps/web only, so it runs when apps/web is in the
      # affected selection — which, via `...[<ref>]`, includes every change to
      # a package apps/web depends on. The selection is read from the real
      # workspace graph rather than a path glob, so a new dependency edge
      # cannot silently drop the gate.
      - name: Decide whether the browser suite applies
        id: applies
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          base="$(git merge-base "$BASE_SHA" HEAD)"
          changed="$(git diff --name-only "$base" HEAD)"
          if grep -qE '^(\.github/workflows/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$|\.npmrc$|vitest\.shared\.ts$|tsconfig[^/]*\.json$)' <<<"$changed"; then
            echo "Root-level change detected; running the browser suite."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          selected="$(pnpm -r \
            --filter "!$WORKSPACE_ROOT_PROJECT" \
            --filter "...[$base]" \
            list --depth -1 --json | jq -r '.[].name')"
          printf 'Affected packages:\n%s\n' "$selected"

          if grep -qx '@code-review/web' <<<"$selected"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # Keyed on the resolved Playwright version (the lockfile decides it) so
      # a version bump misses the cache and re-downloads, and every other run
      # skips the ~95 MB browser download.
      - name: Resolve Playwright version
        id: playwright
        if: steps.applies.outputs.run == 'true'
        run: |
          set -euo pipefail
          version="$(pnpm -C apps/web exec playwright --version | awk '{print $2}')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: browser-cache
        if: steps.applies.outputs.run == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium and its system dependencies
        if: steps.applies.outputs.run == 'true' && steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm -C apps/web exec playwright install --with-deps chromium

      # The cache holds the browser binaries, never the apt packages they
      # link against, so a cache hit still needs the system libraries.
      - name: Install system dependencies for the cached browser
        if: steps.applies.outputs.run == 'true' && steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm -C apps/web exec playwright install-deps chromium

      - name: Run the browser suite
        if: steps.applies.outputs.run == 'true'
        run: pnpm -C apps/web test:e2e

      # Failure only, 7 days: the trace of the retried run is what makes a red
      # browser test diagnosable without reproducing it locally.
      - name: Upload Playwright traces and report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics
          path: |
            apps/web/test-results/**
            apps/web/playwright-report/**
            !**/node_modules/**
          retention-days: 7
          if-no-files-found: ignore

  required-checks-passed:
    name: required-checks-passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    # The single branch-protection check. Path/graph filtering means the
    # per-check jobs legitimately skip, and a skipped required check blocks
    # a PR forever — so the gate is this one job, which always reports.
    if: always()
    needs:
      - lint
      - catalog
      - checks
      - e2e

    steps:
      - name: Verify every required job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          printf '%s\n' "$NEEDS"

          # `success` or `skipped` is fine; `failure` and `cancelled` are not.
          failed="$(printf '%s' "$NEEDS" \
            | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')"

          if [ -n "$failed" ]; then
            echo "::error::Required jobs did not pass: $(printf '%s' "$failed" | tr '\n' ' ')"
            exit 1
          fi

          echo "All required jobs passed."
