name: CI

on:
  pull_request:

# Fork-safety bundle. No ambient scopes: every job re-grants
# the minimum it needs, no checkout leaves credentials in .git/config for a
# later step to reuse, and every action is pinned to a commit SHA.
# `pull_request_target` is banned in this repo — it would run fork code with
# a write-scoped token.
permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # The workspace root is a pnpm project too, and pnpm's `...[<ref>]` filter
  # attributes every file outside a package directory to it. Its scripts are
  # thin aliases for package scripts (`test` = categorizer, `typecheck` =
  # apps/web), so leaving it selected would re-run those suites under a
  # second name on any docs- or config-only change.
  WORKSPACE_ROOT_PROJECT: mergebrief-monorepo

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The baseline gate inside `pnpm lint` resolves
          # `merge-base(base.sha, HEAD)`, so the base branch's history has to
          # be here. A shallow checkout makes the gate fail, not pass.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Full workspace install: --type-aware needs each package's tsconfig
      # and dependency types, not just the oxlint binary.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Unfiltered on purpose: `pnpm lint` is a whole-repo gate (oxlint with
      # the house plugin, knip, `prettier --check .`, stylelint, and the
      # product operation catalog gate: CLI-map exhaustiveness).
      # Prettier and knip read files no package owns — docs, root config —
      # so there is no change set that provably cannot break it.
      - name: Run lint
        env:
          # The PR base, named explicitly: the gate's local default is `main`,
          # which is not the base of a stacked PR.
          MERGEBRIEF_BASELINE_BASE: ${{ github.event.pull_request.base.sha }}
        run: pnpm lint

  catalog:
    name: Catalog gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Its own job, not a link in `pnpm lint`: this is a correctness gate
      # (CLI-map exhaustiveness and the only evaluation of a gap's expiry
      # against the real date), and a style finding in an
      # untouched file must not be what stops it from running. Unfiltered and
      # deterministic — no network, a couple of seconds.
      - name: Run the product operation catalog gate
        run: pnpm check:catalog

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Scans only the commits this PR adds, opening archives one level deep
      # so a gzipped eval fixture is read. The release export's tree scan
      # reads the same config and depth, so one allowlist governs both gates.
      # A binary blob gitleaks cannot open as an archive only logs an ERR
      # line and exits 0, so any ERR line fails the step.
      - name: Run gitleaks on the PR commits
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --log-opts="origin/${BASE_REF}..HEAD" --max-archive-depth 1 \
            --config /repo/.github/gitleaks.toml --redact --no-banner --no-color --exit-code 1 \
            2>&1 | tee "$RUNNER_TEMP/gitleaks.log"
          if grep -qE '^[0-9]{1,2}:[0-9]{2}(AM|PM) ERR ' "$RUNNER_TEMP/gitleaks.log"; then
            echo "::error::gitleaks could not read every file; see the ERR lines above"
            exit 1
          fi

  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # `slug` mirrors `check` with a filename-safe spelling: artifact
        # names reject `:`.
        include:
          - check: typecheck
            slug: typecheck
          - check: test
            slug: test
          - check: build
            slug: build
          - check: docs:check
            slug: docs-check

    # The real-Postgres suites, test leg only: the runner skips a service
    # whose image is empty. Throwaway credentials for an ephemeral container.
    services:
      postgres:
        image: ${{ matrix.check == 'test' && 'postgres:17-alpine' || '' }}
        env:
          POSTGRES_USER: mergebrief
          POSTGRES_PASSWORD: mergebrief
          POSTGRES_DB: mergebrief_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mergebrief -d mergebrief_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pnpm's `...[<ref>]` filter resolves the ref in the local repo, so
          # the base branch's history has to be there.
          fetch-depth: 0
          persist-credentials: false

      - name: Select affected packages
        id: affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # A `pull_request` run checks out the merge ref, whose second
          # parent is the base tip, so BASE_SHA is an ancestor of HEAD and
          # merge-base returns it directly — an ancestor pnpm's TWO-dot
          # since-filter can safely diff against (a non-ancestor would report
          # the base branch's own commits as changes and over-select). If
          # base.sha is stale after the base advances, the result is the old
          # base tip: over-selection, never under-selection.
          base="$(git merge-base "$BASE_SHA" HEAD)"
          echo "base=$base" >> "$GITHUB_OUTPUT"

          # Files no package owns but every package depends on. pnpm maps
          # these to the workspace root only, which the filter excludes — so
          # without this escape hatch a lockfile bump would run nothing.
          # Buffered into a variable first: `git diff | grep -q` under
          # pipefail dies of SIGPIPE on >64KB diffs the moment grep exits,
          # silently flipping run_all to false — the escape hatch disarmed
          # exactly when a huge change needs it most.
          changed="$(git diff --name-only "$base" HEAD)"
          if grep -qE '^(\.github/workflows/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$|\.npmrc$|vitest\.shared\.ts$|tsconfig[^/]*\.json$)' <<<"$changed"; then
            echo "run_all=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_all=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.check }} on affected packages
        env:
          CHECK: ${{ matrix.check }}
          SLUG: ${{ matrix.slug }}
          BASE: ${{ steps.affected.outputs.base }}
          RUN_ALL: ${{ steps.affected.outputs.run_all }}
          MERGEBRIEF_TEST_POSTGRES_URL: postgres://mergebrief:mergebrief@127.0.0.1:5432/mergebrief_test
        run: |
          set -euo pipefail

          # `...[<ref>]` = packages changed since <ref> PLUS every package
          # that depends on them, read off the real workspace graph. That is
          # the path-filter hole: a github-package change now runs api's
          # suite too.
          filters=(--filter "!$WORKSPACE_ROOT_PROJECT")
          if [ "$RUN_ALL" = "true" ]; then
            echo "Root-level change detected; running the full workspace."
          else
            filters+=(--filter "...[$BASE]")
            # The two cross-process consumers. Their suites start the real
            # `api` executable over HTTP, and pnpm's graph cannot see an edge
            # that is not an import, so an API-only change would otherwise
            # run neither.
            selected="$(pnpm -r --filter "!$WORKSPACE_ROOT_PROJECT" \
              --filter "...[$BASE]" list --depth -1 --json | jq -r '.[].name')"
            if grep -qx 'api' <<<"$selected"; then
              echo "API changed; adding its HTTP consumers to the selection."
              filters+=(--filter "web" --filter "mergebrief")
            fi
          fi

          # `--if-present` because the matrix is one script name across the
          # whole selection: only apps/web and the CLI have `build`, only the
          # CLI has `docs:check`. An empty selection exits 0 — that is the
          # skip.
          #
          # `pipefail` is already set, so `tee` cannot mask a failing suite.
          mkdir -p ci-logs
          pnpm -r "${filters[@]}" run --if-present "$CHECK" 2>&1 | tee "ci-logs/$SLUG.log"

      # Failure only: a green run's logs are already in the job output, and
      # a 7-day window is long enough to triage a red PR without paying
      # storage for every merge.
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-${{ matrix.slug }}-diagnostics
          # Anchored to the workspace globs in pnpm-workspace.yaml. An
          # unanchored `**/coverage/**` would make the uploader stat the
          # whole pnpm node_modules tree on every red run.
          path: |
            ci-logs/
            apps/*/coverage/**
            packages/*/coverage/**
            tools/*/coverage/**
            !**/node_modules/**
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: E2E (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same reason as `checks`: pnpm's `...[<ref>]` filter resolves the
          # ref in the local repo.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The suite drives apps/web AND starts the real `api` executable, so it
      # runs when either is in the affected selection. `...[<ref>]` covers
      # every package each of them depends on. `api` has to be named
      # explicitly: web reaches it over HTTP now, and pnpm's graph cannot see
      # a dependency that is not an import.
      - name: Decide whether the browser suite applies
        id: applies
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          base="$(git merge-base "$BASE_SHA" HEAD)"
          changed="$(git diff --name-only "$base" HEAD)"
          if grep -qE '^(\.github/workflows/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$|\.npmrc$|vitest\.shared\.ts$|tsconfig[^/]*\.json$)' <<<"$changed"; then
            echo "Root-level change detected; running the browser suite."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          selected="$(pnpm -r \
            --filter "!$WORKSPACE_ROOT_PROJECT" \
            --filter "...[$base]" \
            list --depth -1 --json | jq -r '.[].name')"
          printf 'Affected packages:\n%s\n' "$selected"

          if grep -qxE 'web|api' <<<"$selected"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # Keyed on the resolved Playwright version (the lockfile decides it) so
      # a version bump misses the cache and re-downloads, and every other run
      # skips the ~95 MB browser download.
      - name: Resolve Playwright version
        id: playwright
        if: steps.applies.outputs.run == 'true'
        run: |
          set -euo pipefail
          version="$(pnpm -C apps/web exec playwright --version | awk '{print $2}')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: browser-cache
        if: steps.applies.outputs.run == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium and its system dependencies
        if: steps.applies.outputs.run == 'true' && steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm -C apps/web exec playwright install --with-deps chromium

      # The cache holds the browser binaries, never the apt packages they
      # link against, so a cache hit still needs the system libraries.
      - name: Install system dependencies for the cached browser
        if: steps.applies.outputs.run == 'true' && steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm -C apps/web exec playwright install-deps chromium

      - name: Run the browser suite
        if: steps.applies.outputs.run == 'true'
        run: pnpm -C apps/web test:e2e

      # Failure only, 7 days: the trace of the retried run is what makes a red
      # browser test diagnosable without reproducing it locally.
      - name: Upload Playwright traces and report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics
          path: |
            apps/web/test-results/**
            apps/web/playwright-report/**
            !**/node_modules/**
          retention-days: 7
          if-no-files-found: ignore

  image:
    name: Image build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The packaging files, plus the web source the image copies by name
      # (its entry, its preload, src/server and the build config): an import
      # there that leaves the allow-list resolves in dev and fails only in the
      # image. Other source changes are covered by the test matrix.
      - name: Select packaging changes
        id: packaging
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="$(git merge-base "$BASE_SHA" HEAD)"
          changed="$(git diff --name-only "$base" HEAD)"
          if grep -qE '^(Dockerfile|docker-entrypoint\.sh|\.dockerignore|docker-compose[^/]*\.yml|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.npmrc|package\.json|(apps|packages|tools)/[^/]+/package\.json|\.github/workflows/(ci|release)\.yml|\.github/scripts/image-boot-smoke\.sh|apps/web/src/(serve|instrument)\.ts|apps/web/src/server/.*|apps/web/vite\.config\.ts)$' <<<"$changed"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # The docker driver builds straight into the daemon: one platform, no
      # tarball export of the tree, and no Actions cache (a PR-scoped entry
      # is read back only by a same-SHA re-run). `load: true` keeps the
      # action from adding a provenance attestation, which the docker driver
      # refuses on the classic image store.
      - name: Set up Buildx
        if: steps.packaging.outputs.changed == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker

      - name: Build the image
        if: steps.packaging.outputs.changed == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: mergebrief:pr

      # The entrypoint contract: an unknown word prints the four valid ones
      # and exits 1. A silent image would mean the entrypoint never ran.
      - name: Smoke the entrypoint
        if: steps.packaging.outputs.changed == 'true'
        run: |
          set -euo pipefail
          set +e
          output="$(docker run --rm mergebrief:pr bogus 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          [ "$status" -eq 1 ] || { echo "::error::expected exit 1, got $status"; exit 1; }
          grep -q "api | web | worker | migrate" <<<"$output"

      # Boots the image as compose runs it: migrate, then api, web (healthz,
      # readyz through the api, a signed-out page) and worker against a
      # throwaway Postgres. A runtime import the prod install dropped fails
      # here; the entrypoint smoke above cannot see one.
      - name: Boot the image
        if: steps.packaging.outputs.changed == 'true'
        run: bash .github/scripts/image-boot-smoke.sh mergebrief:pr

  required-checks-passed:
    name: required-checks-passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    # The single branch-protection check. Path/graph filtering means the
    # per-check jobs legitimately skip, and a skipped required check blocks
    # a PR forever — so the gate is this one job, which always reports.
    if: always()
    needs:
      - lint
      - catalog
      - secrets
      - checks
      - e2e
      - image

    steps:
      - name: Verify every required job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          printf '%s\n' "$NEEDS"

          # `success` or `skipped` is fine; `failure` and `cancelled` are not.
          failed="$(printf '%s' "$NEEDS" \
            | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')"

          if [ -n "$failed" ]; then
            echo "::error::Required jobs did not pass: $(printf '%s' "$failed" | tr '\n' ' ')"
            exit 1
          fi

          echo "All required jobs passed."
