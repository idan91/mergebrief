name: Freshness

# Generated artifacts are committed, so they can drift from the sources they
# are derived from and nothing else would notice. This job
# regenerates them and fails on any working-tree diff — the fix is always to
# run the same command locally and commit the result.
#
# Two independent surfaces share one workflow because GitHub's `paths:` is
# workflow-level: the union triggers the run, and each regeneration is then
# gated on its own paths inside the job so a schema-only PR does not pay for
# a web build.
on:
  pull_request:
    paths:
      # TanStack route tree — regenerated by the web build.
      - "apps/web/src/routes/**"
      - "apps/web/src/routeTree.gen.ts"
      - "apps/web/vite.config.ts"
      # Drizzle migration state — regenerated by drizzle-kit generate.
      - "packages/persistence/src/schema/**"
      - "packages/persistence/drizzle/**"
      - "packages/persistence/drizzle.config.ts"
      - ".github/workflows/freshness.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: freshness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  freshness:
    name: Generated artifacts are current
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The per-surface gating below diffs against the base commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Decide which artifacts to regenerate
        id: surfaces
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # workflow_dispatch has no base to diff against — regenerate both.
          if [ -z "${BASE_SHA:-}" ]; then
            echo "route_tree=true" >> "$GITHUB_OUTPUT"
            echo "drizzle=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$(git merge-base "$BASE_SHA" HEAD)" HEAD)"

          # The workflow file itself gates both, so a change to this file
          # exercises the whole gate.
          if printf '%s\n' "$changed" | grep -qE '^(apps/web/(src/routes/|src/routeTree\.gen\.ts$|vite\.config\.ts$)|\.github/workflows/freshness\.yml$)'; then
            echo "route_tree=true" >> "$GITHUB_OUTPUT"
          else
            echo "route_tree=false" >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "$changed" | grep -qE '^(packages/persistence/(src/schema/|drizzle/|drizzle\.config\.ts$)|\.github/workflows/freshness\.yml$)'; then
            echo "drizzle=true" >> "$GITHUB_OUTPUT"
          else
            echo "drizzle=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # There is no standalone route-tree CLI in this workspace: the
      # TanStack Start vite plugin writes `routeTree.gen.ts` as part of the
      # build, so the build IS the regeneration command. On a routes PR this
      # overlaps CI's own `build` leg; the duplicate is the price of the
      # route tree having no cheaper regeneration hook.
      - name: Regenerate the TanStack route tree
        if: steps.surfaces.outputs.route_tree == 'true'
        run: pnpm -C apps/web build

      - name: Regenerate drizzle migration state
        if: steps.surfaces.outputs.drizzle == 'true'
        env:
          # `drizzle-kit generate` diffs the schema against ./drizzle/meta
          # and never opens a connection, but drizzle.config.ts throws
          # without DATABASE_URL — so a placeholder that parses is enough.
          DATABASE_URL: postgres://unused@localhost:5432/unused
        run: |
          set -euo pipefail

          # </dev/null so an ambiguous diff fails fast instead of waiting on
          # a prompt that can never be answered here. `--filter … run` rather
          # than `-C`: knip resolves bare `pnpm -C <dir> <script>` against the
          # ROOT package's scripts, and `generate` only exists on persistence.
          if ! pnpm --filter persistence run generate </dev/null; then
            echo "::error::drizzle-kit generate failed. A create+drop that could be a rename needs an interactive answer, which a runner cannot give — run 'pnpm -C packages/persistence generate' locally, answer the rename prompt, and commit the migration."
            exit 1
          fi

      - name: Fail on drift
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "Generated artifacts are current."
            exit 0
          fi

          {
            echo "### Stale generated artifacts"
            echo
            echo "Regenerate and commit the result:"
            echo
            echo '```'
            echo "pnpm -C apps/web build"
            echo "DATABASE_URL=<any> pnpm -C packages/persistence generate"
            echo '```'
            echo
            echo '```'
            git status --porcelain
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          git --no-pager diff
          echo "::error::Generated artifacts are stale; regenerate and commit them."
          exit 1
